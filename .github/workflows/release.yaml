on: push

name: Release

jobs:
  release:
    name: Release
    runs-on: ubuntu-20.04
    env:
      DOCKER_REPO: saadmtsa/devops_docker_demo_palestine
    steps:
      - uses: actions/checkout@v2

      - name: Build Docker Image
        run: |
          version=${GITHUB_REF##*/}
          docker build . -t $DOCKER_REPO:$version

      - name: Build Binaries
        env:
          CGO_ENABLE: 0
        run: |
          GOOS=linux GOARCH=amd64 go build -o linux_amd64
          GOOS=windows GOARCH=amd64 go build -o windows_amd64
          GOOS=darwin GOARCH=amd64 go build -o darwin_amd64

      - name: Create Local Git Tag
        id: tag
        run: |
          tag_name="v1.0.${GITHUB_RUN_NUMBER}"
          git tag $tag_name
          echo "::set-output name=tag::$tag_name"

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            linux_amd64
            windows_amd64
            darwin_amd64
